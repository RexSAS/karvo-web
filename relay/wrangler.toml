name = "karvo-link"
main = "src/index.js"
compatibility_date = "2026-10-01"
# Custom domain: Cloudflare creates the DNS record and certificate for it (same as rexwoods)
routes = [{ pattern = "link.rxsas.it", custom_domain = true }]

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
